tests:
  - id: chair-stand-30s
    image: ../../assets/exercises/c3-fast-sit-to-stand.png
    imageAlt: Женщина встаёт со стула быстрым движением, руки скрещены на груди
    title: Вставания со стула за 30 секунд
    howTo: Стул у стены, руки скрещены на груди, считать полные вставания за 30 секунд.
    unit: раз
    thresholdNote: Меньше 11–12 повторений для 70–79 лет
    meaning: Сила ног, риск падений
    direction: higherBetter
  - id: tug
    image: ../../assets/tests/tug.png
    imageAlt: Женщина идёт от стула с подлокотниками к оранжевому конусу, отмеченному линией на полу
    title: Timed Up and Go
    howTo: Встать со стула, пройти 3 метра, развернуться, вернуться, сесть. Засечь секундомером.
    unit: с
    thresholdNote: 12 секунд и дольше
    meaning: Подвижность, риск падений
    direction: lowerBetter
  - id: single-leg
    image: ../../assets/exercises/c2-single-leg-stand.png
    imageAlt: Женщина стоит на одной ноге, руки на поясе, вторая нога приподнята, рядом стол для опоры
    title: Стойка на одной ноге
    howTo: Руки на поясе, время до касания пола или опоры, лучшая из трёх попыток. Опора (стол или спинка стула) в пределах вытянутой руки.
    unit: с
    thresholdNote: Меньше 10 секунд
    meaning: Статический баланс
    direction: higherBetter
  - id: four-stage
    image: ../../assets/exercises/c1-tandem-stance.png
    imageAlt: Женщина стоит, поставив стопы пяткой к носку, пальцы слегка касаются стола рядом
    title: Тест четырёх стадий баланса
    howTo: Стопы вместе, полутандем, тандем, одна нога, по 10 секунд каждая. Записать число удержанных стадий. Опора (стол или спинка стула) в пределах вытянутой руки.
    unit: стадий
    thresholdNote: Не удержать тандем 10 секунд
    meaning: Прогресс баланса
    direction: higherBetter
  - id: two-min-step
    image: ../../assets/tests/two-min-step.png
    imageAlt: Женщина шагает на месте, поднимая колено до отметки на стене, руки согнуты в локтях
    title: Двухминутный шаг на месте
    howTo: Поднимать колени до середины бедра, считать подъёмы правого колена за 2 минуты.
    unit: раз
    thresholdNote: Меньше 65–70
    meaning: Выносливость
    direction: higherBetter
  - id: wall-posture
    image: ../../assets/tests/wall-posture.png
    imageAlt: Женщина стоит спиной к стене, затылок, лопатки и ягодицы касаются стены, стопы рядом
    title: Осанка у стены
    howTo: Затылок, лопатки, ягодицы и пятки у стены. Измерить расстояние от затылка до стены без напряжения.
    unit: см
    thresholdNote: Больше 5 см или растёт
    meaning: Грудной кифоз
    direction: lowerBetter
