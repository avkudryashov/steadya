tests:
  - id: chair-stand-30s
    image: ../../assets/exercises/c3-fast-sit-to-stand.png
    imageAlt: Жінка встає зі стільця швидким рухом, руки схрещені на грудях
    title: Вставання зі стільця за 30 секунд
    howTo: Стілець біля стіни, руки схрещені на грудях, рахуйте повні вставання за 30 секунд.
    unit: разів
    thresholdNote: Нижче норми для вашого віку
    thresholdsByAge:
      - { ages: 60–64 роки, value: менше ніж 12 }
      - { ages: 65–69 років, value: менше ніж 11 }
      - { ages: 70–79 років, value: менше ніж 10 }
      - { ages: 80–84 роки, value: менше ніж 9 }
      - { ages: 85–89 років, value: менше ніж 8 }
      - { ages: 90 років і більше, value: менше ніж 4 }
    meaning: Сила ніг, ризик падінь
    direction: higherBetter
  - id: tug
    image: ../../assets/tests/tug.png
    imageAlt: Жінка йде від стільця з підлокітниками до помаранчевого конуса, позначеного лінією на підлозі
    title: Тест «Встань і йди» на час (Timed Up and Go)
    howTo: Встаньте зі стільця, пройдіть 3 метри, розверніться, поверніться й сядьте. Засічіть час секундоміром.
    unit: с
    thresholdNote: 12 секунд і довше
    meaning: Рухливість, ризик падінь
    direction: lowerBetter
  - id: single-leg
    image: ../../assets/exercises/c2-single-leg-stand.png
    imageAlt: Жінка стоїть на одній нозі, руки на поясі, друга нога піднята, поруч стіл для опори
    title: Стійка на одній нозі
    howTo: Руки на поясі, час до того, як торкнетеся підлоги чи опори, найкраща з трьох спроб. Опора (стіл або спинка стільця) на відстані витягнутої руки.
    unit: с
    thresholdNote: Менше ніж 10 секунд
    meaning: Статична рівновага
    direction: higherBetter
  - id: four-stage
    image: ../../assets/exercises/c1-tandem-stance.png
    imageAlt: Жінка стоїть, поставивши стопи п’ятою до носка, пальці легко торкаються столу поруч
    title: Чотириетапний тест рівноваги
    howTo: Стопи разом, напівтандем, тандем, одна нога, по 10 секунд кожен етап. Запишіть кількість етапів, які вдалося втримати. Опора (стіл або спинка стільця) на відстані витягнутої руки.
    unit: етапів
    thresholdNote: Не вдається втримати тандем 10 секунд
    meaning: Прогрес у рівновазі
    direction: higherBetter
  - id: two-min-step
    image: ../../assets/tests/two-min-step.png
    imageAlt: Жінка крокує на місці, піднімаючи коліно до позначки на стіні, руки зігнуті в ліктях
    title: Двохвилинний тест кроків на місці
    howTo: Піднімайте коліна до середини стегна, рахуйте підйоми правого коліна за 2 хвилини.
    unit: разів
    thresholdNote: Нижче норми для вашого віку
    thresholdsByAge:
      - { ages: 60–64 роки, value: менше ніж 75 }
      - { ages: 65–69 років, value: менше ніж 73 }
      - { ages: 70–79 років, value: менше ніж 68 }
      - { ages: 80–84 роки, value: менше ніж 60 }
      - { ages: 85–89 років, value: менше ніж 55 }
      - { ages: 90 років і більше, value: менше ніж 44 }
    meaning: Витривалість
    direction: higherBetter
  - id: wall-posture
    image: ../../assets/tests/wall-posture.png
    imageAlt: Жінка стоїть спиною до стіни, потилиця, лопатки й сідниці торкаються стіни, стопи поруч
    title: Постава біля стіни
    howTo: Потилиця, лопатки, сідниці й п’яти біля стіни. Виміряйте відстань від потилиці до стіни без напруження.
    unit: см
    thresholdNote: Понад 5 см або зростає
    meaning: Грудний кіфоз
    direction: lowerBetter
