id: women-60-plus
title: Estabilidad, fuerza y postura después de los 60
audience: women-60-plus
weeks: 12
phases:
  - id: p1
    weeks: [1, 2]
    label: Semanas 1–2
    goal: Aprender la técnica
    strength: 2 series, esfuerzo 5–6, nivel básico o intermedio
    balance: Solo Otago y equilibrio dinámico, sin potencia
  - id: p2
    weeks: [3, 4]
    label: Semanas 3–4
    goal: Entrar en el ritmo de trabajo
    strength: 3 series, esfuerzo 6–7
    balance: Añadir levantarse rápido de la silla y subidas al escalón
  - id: p3
    weeks: [5, 8]
    label: Semanas 5–8
    goal: Aumento de la carga
    strength: 3 series, esfuerzo 7–8, nivel intermedio
    balance: Bloque completo de potencia, impactos de talón, saltitos
  - id: p4
    weeks: [9, 12]
    label: Semanas 9–12
    goal: Intensificación; la semana 12 es de descarga y pruebas
    strength: 3 series, esfuerzo 8, nivel avanzado donde se sienta preparada
    balance: 'Equilibrio más difícil: ojos cerrados, cojín, doble tarea'
deloadWeeks: [4, 8, 12]
warmup:
  - { text: 'Caminar en el sitio o por la habitación, acelerando poco a poco', minutes: 2 }
  - {
      text: 'Círculos de hombros hacia delante y hacia atrás, 10 veces en cada sentido',
      minutes: 1,
    }
  - { text: 'Balanceos de brazos cruzándolos por delante y de arriba abajo, 10 veces', minutes: 1 }
  - {
      text: 'Medias sentadillas con los brazos hacia delante junto a un apoyo, 10 veces',
      minutes: 1,
    }
  - {
      text: 'Balanceos de pierna hacia delante y hacia atrás junto a un apoyo, 10 veces con cada pierna',
      minutes: 1,
    }
  - { text: 'Círculos de cadera, 8 veces hacia cada lado', minutes: 1 }
  - {
      text: 'Círculos con el pie, de pie sobre una pierna junto a un apoyo, 8 veces con cada pie',
      minutes: 1,
    }
cooldown:
  - { text: Caminar despacio, minutes: 2 }
  - { text: 'Estiramiento de pantorrillas en la pared, 30 segundos cada pierna', minutes: 1 }
  - {
      text: 'Estiramiento de la parte delantera del muslo, de pie junto a un apoyo, 30 segundos cada pierna',
      minutes: 1,
    }
  - { text: Respiración diafragmática, minutes: 1 }
daily:
  - text: Caminar 30 minutos o más a un ritmo que le permita hablar, pero no cantar. Una vez a la semana, haga parte del recorrido cuesta arriba o por escaleras.
    exceptWeekdays: []
    image: ../../../assets/daily/walk.png
    imageAlt: Mujer con chaqueta que camina a paso ligero por un sendero del parque, con los codos flexionados y la mirada al frente
  - text: Rutina de Sinaki, 5 minutos. Extensión de espalda boca abajo, 10 veces de 5 segundos. A partir del segundo mes, con una mochila de 1–2 kg.
    exceptWeekdays: [friday]
    image: ../../../assets/exercises/d1-sinaki-back-extension.png
    imageAlt: Mujer tumbada boca abajo sobre una esterilla con un cojín fino bajo el abdomen, levantando un poco el pecho y la cabeza
days:
  - weekday: monday
    kind: strength
    title: 'Fuerza A: piernas, espalda, agarre'
    durationMin: 60
    blocks:
      - title: Calentamiento
        minutesFrom: 0
        minutesTo: 8
        items:
          - { ref: warmup }
      - title: Piernas y espalda
        minutesFrom: 8
        minutesTo: 29
        items:
          - exercise: chair-squat
            prescriptions:
              p1: { sets: 2, reps: '10', step: base, restSec: 60 }
              p2: { sets: 3, reps: '10', step: working, restSec: 60 }
              p3: { sets: 3, reps: '8–12', step: working, load: mancuerna de 4–6 kg, restSec: 90 }
              p4: { sets: 3, reps: '8–10', step: advanced, load: mancuerna de 8–12 kg, restSec: 90 }
          - exercise: romanian-deadlift
            prescriptions:
              p1: { sets: 2, reps: '10', step: base, restSec: 60 }
              p2: { sets: 3, reps: '10', step: working, load: mancuernas de 3–4 kg, restSec: 60 }
              p3: { sets: 3, reps: '8–12', step: working, load: mancuernas de 4–6 kg, restSec: 90 }
              p4:
                { sets: 3, reps: '8–10', step: advanced, load: mancuernas de 6–10 kg, restSec: 90 }
          - exercise: dumbbell-row
            prescriptions:
              p1:
                { sets: 2, reps: '10 por lado', step: base, load: mancuerna de 2–3 kg, restSec: 60 }
              p2:
                { sets: 3, reps: '10 por lado', step: base, load: mancuerna de 3–4 kg, restSec: 60 }
              p3:
                {
                  sets: 3,
                  reps: '8–12 por lado',
                  step: working,
                  load: mancuerna de 4–6 kg,
                  restSec: 60,
                }
              p4:
                {
                  sets: 3,
                  reps: '8–10 por lado',
                  step: advanced,
                  load: mancuerna de 6–10 kg,
                  restSec: 90,
                }
      - title: Postura y pantorrillas
        minutesFrom: 29
        minutesTo: 46
        items:
          - exercise: band-pull-apart
            prescriptions:
              p1: { sets: 2, reps: '12', step: base, restSec: 45 }
              p2: { sets: 2, reps: '15', step: base, restSec: 45 }
              p3: { sets: 2, reps: '12–15', step: working, restSec: 45 }
              p4: { sets: 2, reps: '12–15', step: advanced, restSec: 45 }
          - exercise: calf-raise
            prescriptions:
              p1: { sets: 2, reps: '12', step: base, restSec: 45 }
              p2: { sets: 3, reps: '12', step: base, restSec: 45 }
              p3: { sets: 3, reps: '12–15', step: working, restSec: 45 }
              p4: { sets: 3, reps: '12 por pierna', step: advanced, restSec: 60 }
          - exercise: glute-bridge
            prescriptions:
              p1: { sets: 2, reps: '12', step: base, restSec: 45 }
              p2: { sets: 3, reps: '12', step: base, restSec: 45 }
              p3: { sets: 3, reps: '10–15', step: working, restSec: 60 }
              p4: { sets: 3, reps: '10 por pierna', step: advanced, restSec: 60 }
      - title: Agarre y tronco
        minutesFrom: 46
        minutesTo: 55
        items:
          - exercise: farmers-carry
            prescriptions:
              p1: { sets: 2, seconds: 30, step: base, load: mancuernas de 3 kg, restSec: 60 }
              p2: { sets: 3, seconds: 30, step: base, load: mancuernas de 4 kg, restSec: 60 }
              p3: { sets: 3, seconds: 40, step: working, load: mancuernas de 5–6 kg, restSec: 60 }
              p4: { sets: 3, seconds: 45, step: advanced, load: mancuernas de 8–10 kg, restSec: 90 }
          - exercise: forearm-plank
            prescriptions:
              p1: { sets: 2, seconds: 20, step: base, restSec: 45 }
              p2: { sets: 3, seconds: 20, step: base, restSec: 45 }
              p3: { sets: 3, seconds: 30, step: working, restSec: 45 }
              p4: { sets: 3, seconds: 40, step: advanced, restSec: 45 }
          - exercise: dead-bug
            prescriptions:
              p1: { sets: 2, reps: '6 por lado', step: base, restSec: 30 }
              p2: { sets: 2, reps: '8 por lado', step: base, restSec: 30 }
              p3: { sets: 2, reps: '8 por lado', step: working, restSec: 30 }
              p4: { sets: 2, reps: '10 por lado', step: advanced, restSec: 30 }
      - title: Vuelta a la calma
        minutesFrom: 55
        minutesTo: 60
        items:
          - { ref: cooldown }

  - weekday: tuesday
    kind: balance
    title: Equilibrio y potencia
    durationMin: 50
    blocks:
      - title: Calentamiento
        minutesFrom: 0
        minutesTo: 8
        items:
          - { ref: warmup }
      - title: 'Bloque 1. Equilibrio estático del programa Otago'
        minutesFrom: 8
        minutesTo: 18
        items:
          - exercise: tandem-stance
            prescriptions:
              p1: { sets: 2, seconds: 10, step: base, note: junto a un apoyo, restSec: 15 }
              p2: { sets: 2, seconds: 20, step: working, restSec: 15 }
              p3: { sets: 2, seconds: 30, step: advanced, restSec: 15 }
              p4:
                {
                  sets: 2,
                  seconds: 30,
                  step: advanced,
                  note: ojos cerrados o sobre un cojín,
                  restSec: 15,
                }
          - exercise: single-leg-stand
            prescriptions:
              p1: { sets: 2, seconds: 10, step: base, note: dedos en el apoyo, restSec: 15 }
              p2: { sets: 2, seconds: 20, step: working, restSec: 15 }
              p3: { sets: 2, seconds: 30, step: working, restSec: 15 }
              p4: { sets: 2, seconds: 30, step: advanced, note: girando la cabeza, restSec: 15 }
      - title: 'Bloque 2. Potencia'
        minutesFrom: 18
        minutesTo: 30
        items:
          - text: Cómo hacer el bloque de potencia en su fase
            byPhase:
              p1: 'Semanas 1–2: solo para conocer los movimientos, a ritmo tranquilo, 1 serie de cada uno, sin impactos'
              p2: 'Inicio: 2 series, ritmo más rápido'
              p3: 'Bloque completo: todos los ejercicios, impactos de talón'
              p4: Bloque completo con variantes más difíciles
          - exercise: fast-sit-to-stand
            prescriptions:
              p1: { sets: 1, reps: '6', step: base, note: 'a ritmo tranquilo', restSec: 60 }
              p2: { sets: 2, reps: '6', step: working, restSec: 60 }
              p3: { sets: 3, reps: '8', step: working, restSec: 60 }
              p4: { sets: 3, reps: '8', step: advanced, restSec: 60 }
          - exercise: step-up
            prescriptions:
              p1:
                {
                  sets: 1,
                  reps: '6 por pierna',
                  step: base,
                  note: 'a ritmo tranquilo',
                  restSec: 45,
                }
              p2: { sets: 2, reps: '6 por pierna, rápido', step: base, restSec: 45 }
              p3: { sets: 3, reps: '6 por pierna, rápido', step: working, restSec: 60 }
              p4:
                {
                  sets: 3,
                  reps: '6 por pierna, rápido',
                  step: advanced,
                  load: plataforma de 15–20 cm,
                  restSec: 60,
                }
          - exercise: heel-drop
            prescriptions:
              p1:
                {
                  sets: 1,
                  reps: '10',
                  step: base,
                  note: 'sin impacto, solo subir y bajar con suavidad',
                  restSec: 30,
                }
              p2: { sets: 2, reps: '10', step: base, restSec: 30 }
              p3: { sets: 2, reps: '10', step: working, restSec: 30 }
              p4:
                {
                  sets: 2,
                  reps: '10',
                  step: advanced,
                  note: 'más saltitos, 2 × 10, si no le duelen las rodillas',
                  restSec: 45,
                }
      - title: 'Bloque 3. Equilibrio dinámico, reacción, doble tarea'
        minutesFrom: 30
        minutesTo: 44
        items:
          - exercise: tandem-walk
            prescriptions:
              p1: { sets: 2, reps: '10 pasos hacia delante', step: base, restSec: 20 }
              p2:
                {
                  sets: 3,
                  reps: '10 pasos hacia delante y 10 hacia atrás',
                  step: working,
                  restSec: 20,
                }
              p3:
                {
                  sets: 3,
                  reps: '10 hacia delante y 10 hacia atrás',
                  step: working,
                  note: 'contando hacia atrás de 3 en 3 desde 100',
                  restSec: 20,
                }
              p4:
                {
                  sets: 3,
                  reps: '10 hacia delante y 10 hacia atrás',
                  step: advanced,
                  note: 'con una taza en la mano, pasándola de una mano a otra',
                  restSec: 20,
                }
          - {
              text: 'Caminar de puntillas 10 pasos y sobre los talones 10 pasos, 2 vueltas',
              minutes: 2,
            }
          - {
              text: 'Caminar de lado con pasos laterales, 10 pasos hacia cada lado, 2 vueltas',
              minutes: 2,
            }
          - { text: 'Giro de 360 grados con pasos cortos, 2 veces hacia cada lado', minutes: 1 }
          - {
              text: 'Desplazar el peso hasta el límite: inclínese hacia delante, hacia atrás y hacia los lados hasta donde pueda mantener el equilibrio, y vuelva. 8 veces en cada dirección.',
              minutes: 2,
            }
          - exercise: reactive-step
            prescriptions:
              p1: { sets: 1, reps: '4 hacia atrás', step: base, restSec: 20 }
              p2: { sets: 1, reps: '6 hacia atrás', step: base, restSec: 20 }
              p3:
                {
                  sets: 1,
                  reps: '6 en cada dirección',
                  step: working,
                  note: 'hacia atrás, hacia delante y hacia los lados',
                  restSec: 20,
                }
              p4:
                {
                  sets: 2,
                  reps: '6 en cada dirección',
                  step: advanced,
                  note: 'hacia atrás, hacia delante y hacia los lados',
                  restSec: 20,
                }
          - {
              text: 'Recoger un objeto del suelo agachándose en sentadilla o en zancada, 8 veces',
              minutes: 2,
            }
      - title: Vuelta a la calma
        minutesFrom: 44
        minutesTo: 50
        items:
          - { ref: cooldown }

  - weekday: wednesday
    kind: walk
    title: Caminar y espalda
    durationMin: 45
    note: 'Día sin ejercicios de fuerza: solo caminar y la rutina de espalda de las tareas diarias'
    blocks: []

  - weekday: thursday
    kind: strength
    title: 'Fuerza B: piernas, hombros, pecho'
    durationMin: 60
    blocks:
      - title: Calentamiento
        minutesFrom: 0
        minutesTo: 8
        items:
          - { ref: warmup }
      - title: Piernas
        minutesFrom: 8
        minutesTo: 22
        items:
          - exercise: step-up
            prescriptions:
              p1:
                {
                  sets: 2,
                  reps: '8 por pierna',
                  step: base,
                  load: 'plataforma de 10 cm, junto a un apoyo',
                  restSec: 60,
                }
              p2:
                {
                  sets: 3,
                  reps: '8 por pierna',
                  step: base,
                  load: plataforma de 10 cm,
                  restSec: 60,
                }
              p3:
                {
                  sets: 3,
                  reps: '8–10 por pierna',
                  step: working,
                  load: plataforma de 15 cm sin apoyo,
                  restSec: 60,
                }
              p4:
                {
                  sets: 3,
                  reps: '8 por pierna',
                  step: advanced,
                  load: 'plataforma de 15–20 cm, mancuernas de 3–5 kg',
                  restSec: 90,
                }
          - exercise: split-squat
            prescriptions:
              p1: { sets: 2, reps: '8 por pierna', step: base, restSec: 60 }
              p2: { sets: 3, reps: '8 por pierna', step: base, restSec: 60 }
              p3: { sets: 3, reps: '8–10 por pierna', step: working, restSec: 60 }
              p4:
                {
                  sets: 3,
                  reps: '8 por pierna',
                  step: advanced,
                  load: mancuernas de 3–6 kg,
                  restSec: 90,
                }
      - title: Hombros y pecho
        minutesFrom: 22
        minutesTo: 41
        items:
          - exercise: overhead-press
            prescriptions:
              p1:
                {
                  sets: 2,
                  reps: '10',
                  step: base,
                  load: 'mancuernas de 2 kg, sentada',
                  restSec: 60,
                }
              p2:
                {
                  sets: 3,
                  reps: '10',
                  step: base,
                  load: 'mancuernas de 3 kg, sentada',
                  restSec: 60,
                }
              p3:
                {
                  sets: 3,
                  reps: '8–12',
                  step: working,
                  load: 'mancuernas de 3–5 kg, de pie',
                  restSec: 60,
                }
              p4:
                {
                  sets: 3,
                  reps: '8–10',
                  step: advanced,
                  load: 'mancuernas de 5–8 kg, de pie',
                  restSec: 90,
                }
          - exercise: wall-pushup
            prescriptions:
              p1: { sets: 2, reps: '10', step: base, restSec: 60 }
              p2: { sets: 3, reps: '10', step: base, note: contra la pared o una mesa, restSec: 60 }
              p3: { sets: 3, reps: '8–12', step: working, restSec: 60 }
              p4: { sets: 3, reps: '8–10', step: advanced, restSec: 60 }
          - exercise: overhead-band-pull-apart
            prescriptions:
              p1: { sets: 2, reps: '12', step: base, restSec: 45 }
              p2: { sets: 3, reps: '10', step: base, restSec: 45 }
              p3: { sets: 3, reps: '10–12', step: working, restSec: 45 }
              p4: { sets: 3, reps: '10 con pausa', step: advanced, restSec: 45 }
      - title: Caderas y postura
        minutesFrom: 41
        minutesTo: 50
        items:
          - exercise: band-side-steps
            prescriptions:
              p1: { sets: 2, reps: '12 tumbada de lado', step: base, restSec: 30 }
              p2: { sets: 2, reps: '15 tumbada de lado', step: base, restSec: 30 }
              p3: { sets: 2, reps: '12–15', step: working, note: 'de pie con banda', restSec: 30 }
              p4:
                { sets: 2, reps: '15 pasos', step: advanced, note: 'hacia cada lado', restSec: 30 }
          - exercise: prone-y-raise
            prescriptions:
              p1: { sets: 2, reps: '10', step: base, restSec: 30 }
              p2: { sets: 2, reps: '12', step: base, restSec: 30 }
              p3: { sets: 2, reps: '12–15 con pausa', step: working, restSec: 30 }
              p4: { sets: 2, reps: '12', step: advanced, load: 'botellas de 0,5 l', restSec: 30 }
      - title: Tronco
        minutesFrom: 50
        minutesTo: 55
        items:
          - exercise: side-plank-knee
            prescriptions:
              p1: { sets: 2, seconds: 15, step: base, note: por lado, restSec: 30 }
              p2: { sets: 3, seconds: 15, step: base, note: por lado, restSec: 30 }
              p3: { sets: 3, seconds: 25, step: working, note: por lado, restSec: 30 }
              p4: { sets: 3, seconds: 30, step: advanced, note: por lado, restSec: 30 }
          - exercise: bird-dog
            prescriptions:
              p1: { sets: 2, reps: '6 por lado', step: base, restSec: 30 }
              p2: { sets: 2, reps: '8 por lado', step: base, restSec: 30 }
              p3: { sets: 2, reps: '8 por lado', step: working, restSec: 30 }
              p4: { sets: 2, reps: '10 por lado', step: advanced, restSec: 30 }
      - title: Vuelta a la calma
        minutesFrom: 55
        minutesTo: 60
        items:
          - { ref: cooldown }

  - weekday: friday
    kind: posture
    title: Postura y movilidad
    durationMin: 45
    blocks:
      - title: Calentamiento
        minutesFrom: 0
        minutesTo: 8
        items:
          - { ref: warmup }
      - title: Espalda
        minutesFrom: 8
        minutesTo: 14
        items:
          - exercise: sinaki-back-extension
            prescriptions:
              p1: { sets: 1, reps: '10 de 5 segundos', step: base, restSec: 0 }
              p2: { sets: 1, reps: '10 de 5 segundos', step: base, restSec: 0 }
              p3:
                {
                  sets: 1,
                  reps: '10 de 5 segundos',
                  step: working,
                  load: mochila de 1 kg,
                  restSec: 0,
                }
              p4:
                {
                  sets: 1,
                  reps: '10 de 5 segundos',
                  step: advanced,
                  load: mochila de 2 kg,
                  restSec: 0,
                }
      - title: Zona dorsal y hombros
        minutesFrom: 14
        minutesTo: 26
        items:
          - exercise: thoracic-foam-roll
            prescriptions:
              p1: { sets: 1, reps: '10 con pausa de 3 s', step: base, restSec: 0 }
              p2: { sets: 1, reps: '10 con pausa de 3 s', step: base, restSec: 0 }
              p3: { sets: 1, reps: '10 con pausa de 3 s', step: working, restSec: 0 }
              p4: { sets: 1, reps: '10 con pausa de 3 s', step: working, restSec: 0 }
          - exercise: wall-angel
            prescriptions:
              p1: { sets: 1, reps: '10', step: base, restSec: 30 }
              p2: { sets: 2, reps: '10', step: base, restSec: 30 }
              p3: { sets: 2, reps: '10', step: working, restSec: 30 }
              p4: { sets: 2, reps: '10 con pausa de 3 s', step: advanced, restSec: 30 }
          - exercise: doorway-chest-stretch
            prescriptions:
              p1: { sets: 2, seconds: 20, step: base, restSec: 10 }
              p2: { sets: 3, seconds: 30, step: working, restSec: 10 }
              p3: { sets: 3, seconds: 30, step: working, restSec: 10 }
              p4: { sets: 3, seconds: 30, step: advanced, restSec: 10 }
          - exercise: chin-tuck
            prescriptions:
              p1: { sets: 1, reps: '10 de 5 segundos', step: base, restSec: 0 }
              p2: { sets: 1, reps: '10 de 5 segundos', step: base, restSec: 0 }
              p3: { sets: 1, reps: '10 de 5 segundos', step: working, restSec: 0 }
              p4: { sets: 1, reps: '10 de 5 segundos', step: working, restSec: 0 }
          - { text: 'Círculos con los omóplatos, sentada, 10 hacia cada lado', minutes: 1 }
      - title: Pelvis, caderas y tobillos
        minutesFrom: 26
        minutesTo: 38
        items:
          - exercise: hip-flexor-stretch
            prescriptions:
              p1: { sets: 2, seconds: 20, step: base, note: por lado, restSec: 10 }
              p2: { sets: 3, seconds: 30, step: working, note: por lado, restSec: 10 }
              p3: { sets: 3, seconds: 30, step: working, note: por lado, restSec: 10 }
              p4: { sets: 3, seconds: 30, step: advanced, note: por lado, restSec: 10 }
          - exercise: calf-stretch
            prescriptions:
              p1: { sets: 2, seconds: 20, step: base, note: cada pierna, restSec: 10 }
              p2: { sets: 2, seconds: 30, step: working, note: cada pierna, restSec: 10 }
              p3: { sets: 2, seconds: 30, step: working, note: cada pierna, restSec: 10 }
              p4: { sets: 2, seconds: 30, step: advanced, note: cada pierna, restSec: 10 }
          - exercise: clamshell
            prescriptions:
              p1: { sets: 1, reps: '15 por lado', step: base, restSec: 30 }
              p2: { sets: 2, reps: '15 por lado', step: base, restSec: 30 }
              p3: { sets: 2, reps: '15 por lado', step: working, restSec: 30 }
              p4: { sets: 2, reps: '15 por lado', step: advanced, restSec: 30 }
          - {
              text: 'Sentada en posición 90/90: rotación externa e interna de cadera, 10 cambios lentos',
              minutes: 2,
            }
          - {
              text: 'Tobillos: sentada, escriba el abecedario en el aire con el pie, 1 vez con cada pie',
              minutes: 2,
            }
          - exercise: cat-cow
            prescriptions:
              p1: { sets: 1, reps: '10 ciclos', step: base, note: despacio, restSec: 0 }
              p2: { sets: 1, reps: '10 ciclos', step: base, note: despacio, restSec: 0 }
              p3: { sets: 1, reps: '10 ciclos', step: working, note: despacio, restSec: 0 }
              p4: { sets: 1, reps: '10 ciclos', step: working, note: despacio, restSec: 0 }
      - title: Respiración
        minutesFrom: 38
        minutesTo: 45
        items:
          - exercise: diaphragm-breathing
            prescriptions:
              p1: { sets: 1, seconds: 300, step: base, restSec: 0 }
              p2: { sets: 1, seconds: 300, step: base, restSec: 0 }
              p3: { sets: 1, seconds: 300, step: working, restSec: 0 }
              p4: { sets: 1, seconds: 300, step: working, restSec: 0 }
          - {
              text: 'Cada 4 semanas, prueba de postura contra la pared; anote el resultado en el diario',
              minutes: 2,
            }

  - weekday: saturday
    kind: optional
